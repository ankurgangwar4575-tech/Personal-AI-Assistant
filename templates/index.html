<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Personal Assistant</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="icon" type="image/png"
        href="https://imgs.search.brave.com/OaP4ugd_hv_q632rJSgslesVqiB1c8JX7N28tEixSnI/rs:fit:860:0:0:0/g:ce/aHR0cHM6Ly9jZG4u/aWNvbnNjb3V0LmNv/bS9pY29uL3ByZW1p/dW0vcG5nLTI1Ni10/aHVtYi9haS1jaGF0/Ym90LWljb24tc3Zn/LWRvd25sb2FkLXBu/Zy05ODUyNjc4LnBu/Zz9mPXdlYnAmdz0x/Mjg">
</head>

<body>
    <h1 class="main-heading">Personal AI ChatBot</h1>
    <p class="deployment-notice">
        ⚠️ Note: This app is hosted on a free server. If it has been inactive
        for a while, the first response may take some time to load.
        Please wait patiently while the server wakes up.
    </p>
    <div class="container">

        <h2>Ask Anything</h2>
        <form id="askForm">
            <input type="text" name="question" placeholder="Ask anything..." required>
            <button type="submit">Ask</button>
        </form>
        <p id="ans-loading" style="display: none;">Processing...</p>
        <p id="answer"></p>

        <hr>

        <h2>Summarize Email</h2>
        <form id="emailForm">
            <textarea type="text" name="email" placeholder="Paste your email here.." required></textarea>
            <button type="submit">Summarize</button>
        </form>
        <p id="summary-loading" style="display: none;">Processing...</p>
        <p id="summary"></p>

    </div>

    <script>
        async function handleRequest(formId, endpoint, loadingId, outputId) {
            const form = document.getElementById(formId);
            const loading = document.getElementById(loadingId);
            const output = document.getElementById(outputId);
            const button = form.querySelector('button[type="submit"]');

            form.onsubmit = async (e) => {
                e.preventDefault();

                const formData = new FormData(form);

                loading.style.display = "block";
                output.innerText = "";
                button.disabled = true;

                try {
                    const res = await fetch(endpoint, {
                        method: "POST",
                        body: formData
                    });

                    const data = await res.json();

                    output.innerText = data.response ||
                        "No response received. Please try again.";

                } catch (error) {
                    console.error("Request failed:", error);
                    output.innerText =
                        "Unable to connect to the server. Please try again later.";

                } finally {
                    loading.style.display = "none";
                    button.disabled = false;
                }
            };
        }

        handleRequest("askForm", "/ask", "ans-loading", "answer");
        handleRequest(
            "emailForm",
            "/summarize",
            "summary-loading",
            "summary"
        );

        async function checkServer() {
            const notice = document.getElementById("deploymentNotice");

            try {
                const response = await fetch("/", {
                    method: "GET"
                });

                if (response.ok) {
                    notice.style.display = "none";
                }
            } catch (error) {
            }
        }

        checkServer();

        const serverCheckInterval = setInterval(async () => {
            const notice = document.getElementById("deploymentNotice");

            if (notice && notice.style.display !== "none") {
                await checkServer();
            } else {
                clearInterval(serverCheckInterval);
            }
        }, 3000);
    </script>

</body>

</html>
