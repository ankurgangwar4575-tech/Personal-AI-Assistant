<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Personal Assistant</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <h1 class="main-heading">AI Personal Assistant</h1>

    <div class="container">

        <h2>Ask Anything</h2>
        <form id="askForm">
            <input type="text" name="question" placeholder="Ask anything..." required>
            <button type="submit">Ask</button>
        </form>
        <p id="ans-loading" style="display: none;">Processing...</p>
        <p id="answer"></p>

        <hr>

        <h2>Summarize Email</h2>
        <form id="emailForm">
            <textarea type="text" name="email" placeholder="Paste your email here.." required></textarea>
            <button type="submit">Summarize</button>
        </form>
        <p id="summary-loading" style="display: none;">Processing...</p>
        <p id="summary"></p>

    </div>

    <script>
        async function handleRequest(formId, endpoint, loadingId, outputId) {
            const form = document.getElementById(formId);
            const loading = document.getElementById(loadingId);
            const output = document.getElementById(outputId);
            const button = form.querySelector('button[type="submit"]');

            form.onsubmit = async (e) => {
                e.preventDefault();

                const formData = new FormData(form);

                loading.style.display = "block";
                output.innerText = "";
                button.disabled = true;

                try {
                    const res = await fetch(endpoint, {
                        method: "POST",
                        body: formData
                    });

                    const data = await res.json();

                    output.innerText = data.response ||
                        "No response received. Please try again.";

                } catch (error) {
                    console.error("Request failed:", error);
                    output.innerText =
                        "Unable to connect to the server. Please try again later.";

                } finally {
                    loading.style.display = "none";
                    button.disabled = false;
                }
            };
        }

        handleRequest("askForm", "/ask", "ans-loading", "answer");
        handleRequest(
            "emailForm",
            "/summarize",
            "summary-loading",
            "summary"
        );
    </script>

</body>

</html>
